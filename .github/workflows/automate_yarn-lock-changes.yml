name: Yarn Lock Changes
on:
  pull_request:
    paths:
      - 'yarn.lock'

jobs:
  yarn-lock-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Yarn Lock Changes
        uses: Simek/yarn-lock-changes@v0.14.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
